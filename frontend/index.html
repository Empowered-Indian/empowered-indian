          var script = document.createElement('script')

          isScheduled = true
          if (fallbackTimer) window.clearTimeout(fallbackTimer)
          interactionEvents.forEach(function (eventName) {
            window.removeEventListener(eventName, scheduleAnalytics)
          })

          if ('requestIdleCallback' in window) {
            window.requestIdleCallback(loadAnalytics, { timeout: 2000 })
          } else {
            window.setTimeout(loadAnalytics, 500)
          }
        }

        interactionEvents.forEach(function (eventName) {
          window.addEventListener(eventName, scheduleAnalytics, { passive: true })
        })

            if (!isScheduled) fallbackTimer = window.setTimeout(scheduleAnalytics, 60000)
          },
